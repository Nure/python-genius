<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container small-container">

    <section class="card">
        <h1>Edit Student</h1>

        <form
            action="/students/{{ student.student_id }}/edit"
            method="POST"
            class="student-form"
        >

            <label>Name</label>
            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

            <label>Age</label>
            <input
                type="number"
                name="age"
                value="{{ student.age }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >

            <label>CGPA</label>
            <input
                type="number"
                step="0.01"
                min="0"
                max="4"
                name="cgpa"
                value="{{ student.cgpa }}"
                required
            >

            <label>Course</label>
            <input
                type="text"
                name="course"
                value="{{ student.course }}"
                required
            >

            <label>Skills</label>
            <input
                type="text"
                name="skills"
                value="{{ student.skills }}"
                required
            >

            <button type="submit">Update Student</button>
            <a href="/" class="secondary-button">Cancel</a>

        </form>
    </section>

</div>

</body>
</html>
